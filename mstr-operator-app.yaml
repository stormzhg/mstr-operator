apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mstr-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: PLACEHOLDER_GIT_REPO_URL
      targetRevision: PLACEHOLDER_GIT_BRANCH
      path: charts/mstr-operator
      helm:
        releaseName: mstr-operator
        skipCrds: true
        parameters:
          - name: mstrCustomer.profile
            value: "PLACEHOLDER_PROFILE"
        valueFiles:
          - $values/values/operator-values.yaml
    - repoURL: PLACEHOLDER_GIT_REPO_URL
      targetRevision: PLACEHOLDER_GIT_BRANCH
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mstr-operator
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /metadata/annotations
    - group: ""
      kind: Secret
      name: pkcs12-pass
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: mstr-operator-cluster
      jsonPointers:
        - /data/name
    - group: ""
      kind: Secret
      name: mstr-web-layer-secret
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: mstr-api-layer-secret
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: mstr-cmc-accounts
      jsonPointers:
        - /data
    - group: ""
      kind: PersistentVolumeClaim
      name: mstr-operator-persistent-storage
      jsonPointers:
        - /spec/resources/requests/storage
    - group: batch
      kind: CronJob
      name: mstr-telemetry-cronjob
      jsonPointers:
        - /spec/schedule
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
