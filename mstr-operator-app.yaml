apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mstr-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: "https://github.com/stormzhg/mstr-operator.git"
      targetRevision: "main"
      path: charts/mstr-operator
      helm:
        releaseName: mstr-operator
        skipCrds: true
        parameters:
          - name: mstrCustomer.profile
            value: "a74f297cf05acf4e2fa9967b02b897ebf775a696980105bfd1976b150552ce70fb4e71b442550ce75bea6aac702fa2b8f0092f2b8eaa9c96d374fdc22061192670419f26b67fb18165355e42d9bd7d6ba25e52b092da453afcb08f3b91555f61a6038f72365d6cbcffaca04123ef03d2d8b0b872209617f012460ce450b16b3"
        valueFiles:
          - $values/values/operator-values.yaml
    - repoURL: "https://github.com/stormzhg/mstr-operator.git"
      targetRevision: "main"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: mstr-operator
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /metadata/annotations
    - group: ""
      kind: Secret
      name: pkcs12-pass
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: mstr-operator-cluster
      jsonPointers:
        - /data/name
    - group: ""
      kind: Secret
      name: mstr-web-layer-secret
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: mstr-api-layer-secret
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: mstr-cmc-accounts
      jsonPointers:
        - /data
    - group: ""
      kind: PersistentVolumeClaim
      name: mstr-operator-persistent-storage
      jsonPointers:
        - /spec/resources/requests/storage
    - group: batch
      kind: CronJob
      name: mstr-telemetry-cronjob
      jsonPointers:
        - /spec/schedule
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
